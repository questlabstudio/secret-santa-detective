:root{
  --pine:#1F3A2E; --pine-2:#2C4A3B; --pine-3:#3E5E4C;
  --cream:#FBF6EC; --cream-2:#F3EADB; --paper:#FFFDF8;
  --cranberry:#9E2A3A; --cranberry-2:#B8394A; --berry-soft:#F4DDDD;
  --gold:#C9A45C; --gold-soft:#EADBB8;
  --ink:#2A2724; --ink-2:#5E5850; --ink-3:#8C857A;
  --radius:22px; --radius-s:14px;
  --shadow:0 10px 30px rgba(20,32,25,.18), 0 2px 6px rgba(20,32,25,.10);
  --serif:"Cormorant", Georgia, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--pine);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.backdrop{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(201,164,92,.20), transparent 60%),
    radial-gradient(90% 60% at 100% 100%, rgba(158,42,58,.22), transparent 60%),
    linear-gradient(180deg, #24443A 0%, var(--pine) 55%, #18301F 100%);
}
.app{
  position:relative; z-index:1; min-height:100dvh; max-width:540px; margin:0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 22px);
  display:flex; flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;color:var(--cream)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;letter-spacing:.2px;background:none;border:0;color:inherit;padding:6px 4px;cursor:pointer;border-radius:10px}
.brand svg{width:26px;height:26px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(251,246,236,.25);background:rgba(251,246,236,.06);color:var(--cream);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn[hidden]{display:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* ---------- screens ---------- */
.screen{flex:1;display:flex;flex-direction:column;animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.lead{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:rgba(251,246,236,.86);margin:10px 0 0}

/* home */
.hero{text-align:center;color:var(--cream);padding:26px 6px 8px}
.badge-seal{width:132px;height:132px;margin:6px auto 18px;position:relative}
.badge-seal svg{width:100%;height:100%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.hero h1{font-size:44px;line-height:1.02;letter-spacing:.2px}
.hero h1 span{display:block;font-style:italic;font-weight:400;font-size:30px;color:var(--gold-soft);margin-top:6px}
.invite{margin:18px 0 0;padding:14px 16px;border-radius:var(--radius-s);background:rgba(201,164,92,.14);border:1px solid rgba(201,164,92,.45);color:var(--cream);text-align:left}
.invite b{font-family:var(--serif);font-size:20px;font-weight:600;display:block}
.invite small{color:var(--gold-soft);font-size:14px}
.choices{display:grid;gap:14px;margin-top:22px}
.choice{
  display:flex;align-items:center;gap:16px;text-align:left;width:100%;cursor:pointer;
  padding:18px 18px;border-radius:var(--radius);border:1px solid rgba(201,164,92,.35);
  background:var(--cream);color:var(--ink);box-shadow:var(--shadow);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  font:inherit;
}
.choice:active{transform:scale(.985)}
.choice .ico{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--cream-2)}
.choice.primary{background:linear-gradient(135deg,var(--cranberry),#7E1F2D);color:var(--cream);border-color:rgba(234,219,184,.5)}
.choice.primary .ico{background:rgba(251,246,236,.14)}
.choice h3{font-size:24px;line-height:1.1}
.choice p{margin:4px 0 0;font-size:15px;line-height:1.35;color:inherit;opacity:.82}
.choice .arrow{margin-left:auto;font-size:22px;opacity:.7}
.foot{margin-top:auto;padding-top:26px;text-align:center;color:rgba(251,246,236,.55);font-size:12.5px;line-height:1.6}
.foot a{color:rgba(251,246,236,.75)}

/* quiz */
.progress{margin:6px 2px 0;color:var(--cream)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.4px}
.progress .count{font-weight:600}
.bar{position:relative;height:8px;border-radius:99px;background:rgba(251,246,236,.14);margin-top:8px;overflow:visible}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),#E7C984);width:0;transition:width .5s var(--ease)}
.bar .lens{position:absolute;top:50%;width:26px;height:26px;margin-left:-13px;transform:translateY(-50%);transition:left .5s var(--ease);font-size:20px;line-height:26px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.card{
  margin-top:18px;background:var(--paper);border-radius:28px;padding:24px 18px 20px;box-shadow:var(--shadow);
  border:1px solid rgba(201,164,92,.35);position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;
}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 100% 0%, rgba(201,164,92,.10), transparent 55%);}
.q-eyebrow{color:var(--cranberry);font-weight:600;font-size:12px;letter-spacing:2.4px;text-transform:uppercase}
.q-title{font-size:32px;line-height:1.08;margin-top:8px;color:var(--ink)}
.q-hint{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-2);margin:8px 0 0}
.opts{margin-top:18px;display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{
  font:inherit;cursor:pointer;min-height:64px;border-radius:18px;border:1.5px solid #E8DFCF;background:#FFFFFF;color:var(--ink);
  display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;
  transition:transform .18s var(--ease), border-color .18s, background .18s, box-shadow .18s;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.opt .e{font-size:26px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--cream-2);flex:none}
.opt .t{font-size:17px;font-weight:500;line-height:1.2}
.opt .s{display:block;font-size:13px;color:var(--ink-3);font-weight:400;margin-top:2px}
.opt[aria-checked="true"]{border-color:var(--cranberry);background:#FFF7F5;box-shadow:0 0 0 3px rgba(158,42,58,.14)}
.opt[aria-checked="true"] .e{background:var(--berry-soft)}
.opt:active{transform:scale(.97)}
.opt .tick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #D9CDB8;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;transition:all .18s}
.opt[aria-checked="true"] .tick{background:var(--cranberry);border-color:var(--cranberry)}
/* duo (this or that) */
.duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:10px;margin-top:22px}
.duo .opt{flex-direction:column;justify-content:center;text-align:center;min-height:170px;padding:16px 10px}
.duo .opt .e{width:78px;height:78px;font-size:44px;border-radius:24px}
.duo .opt .t{font-family:var(--serif);font-weight:600;font-size:24px}
.duo .vs{align-self:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold)}
.linkbtn{background:none;border:0;color:var(--ink-2);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;margin:8px auto 0;display:block;min-height:44px}
/* chips (multi) */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{font:inherit;cursor:pointer;min-height:48px;padding:10px 16px;border-radius:99px;border:1.5px solid #E8DFCF;background:#fff;color:var(--ink);font-size:16px;display:inline-flex;align-items:center;gap:8px;transition:all .18s var(--ease)}
.chip[aria-checked="true"]{background:var(--pine);border-color:var(--pine);color:var(--cream)}
.chip:active{transform:scale(.96)}
.chip[aria-disabled="true"]{opacity:.45}
.limit{font-size:13.5px;color:var(--ink-3);margin-top:12px}
/* swatches */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.sw{font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:4px;color:var(--ink);font-size:13px;min-height:44px}
.sw .dot{width:58px;height:58px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s var(--ease), box-shadow .2s}
.sw[aria-checked="true"] .dot{transform:scale(1.08);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--cranberry)}
/* scale */
.scale{margin-top:30px}
.scale .ends{display:flex;justify-content:space-between;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.scale .ends span{display:flex;align-items:center;gap:6px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.step{font:inherit;cursor:pointer;height:64px;border-radius:16px;border:1.5px solid #E8DFCF;background:#fff;display:grid;place-items:center;transition:all .18s var(--ease)}
.step i{display:block;border-radius:50%;background:var(--gold-soft);transition:all .18s}
.step[aria-checked="true"]{border-color:var(--cranberry);background:#FFF7F5}
.step[aria-checked="true"] i{background:var(--cranberry)}
.scale .caption{text-align:center;margin-top:14px;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-2);min-height:26px}
/* text */
.field{margin-top:22px}
.field input{width:100%;font:inherit;font-size:22px;padding:16px 18px;border-radius:18px;border:1.5px solid #E2D7C4;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--cranberry);box-shadow:0 0 0 3px rgba(158,42,58,.15)}
.field small{display:block;margin-top:8px;color:var(--ink-3);font-size:13.5px}
.nav{display:flex;gap:12px;margin-top:auto;padding-top:20px}
.btn{font:inherit;cursor:pointer;min-height:54px;border-radius:99px;padding:0 22px;font-size:17px;font-weight:600;letter-spacing:.3px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease), opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cranberry);color:var(--cream);flex:1;box-shadow:0 8px 18px rgba(158,42,58,.28)}
.btn.primary[disabled]{opacity:.38;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid #E2D7C4}
.btn.gold{background:var(--gold);color:var(--pine);flex:1}
.btn.light{background:var(--cream);color:var(--pine);flex:1}

/* case file */
.result-head{color:var(--cream);text-align:center;padding:10px 0 4px}
.result-head h2{font-size:34px;line-height:1.05;margin-top:6px}
.dossier{
  margin-top:16px;background:var(--paper);border-radius:26px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  border:1px solid rgba(201,164,92,.5);
}
.dossier .tab{position:absolute;top:0;right:26px;background:var(--gold);color:var(--pine);font-weight:600;font-size:11px;letter-spacing:2px;padding:6px 12px;border-radius:0 0 10px 10px}
.d-top{padding:26px 20px 18px;background:linear-gradient(180deg,#FFF9EE,var(--paper));border-bottom:1px dashed #E3D6BE;position:relative}
.d-top .label{font-weight:600;font-size:11.5px;letter-spacing:2.4px;color:var(--ink-3);text-transform:uppercase}
.d-top .name{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1;margin-top:6px}
.d-top .vibe{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--cranberry);margin-top:6px}
.stamp{
  position:absolute;right:16px;bottom:-22px;width:108px;height:108px;border-radius:50%;
  border:3px double var(--cranberry);color:var(--cranberry);display:grid;place-items:center;text-align:center;
  font-weight:600;font-size:12px;letter-spacing:1.6px;line-height:1.25;transform:rotate(-12deg);background:rgba(255,253,248,.8);
  animation:stamp .6s .35s var(--ease) both;
}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}70%{opacity:1;transform:rotate(-12deg) scale(.94)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.d-body{padding:28px 20px 6px;display:grid;gap:18px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--cream);border-radius:14px;padding:10px 12px}
.fact .k{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fact .v{font-size:16px;font-weight:500;margin-top:2px;display:flex;align-items:center;gap:6px}
.section-k{font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 12px;border-radius:99px;background:var(--cream-2);font-size:14.5px}
.tag.no{background:#FBEDEC;color:#7E1F2D;text-decoration:line-through;text-decoration-color:rgba(158,42,58,.5)}
.swatch-line{display:flex;align-items:center;gap:10px;font-size:15.5px}
.swatch-line i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.meter{height:8px;border-radius:99px;background:var(--cream-2);position:relative;margin-top:6px}
.meter b{position:absolute;top:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--cranberry);transform:translateY(-50%);box-shadow:0 0 0 3px var(--paper)}
.meter-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.clues{display:grid;gap:10px}
.clue{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:linear-gradient(135deg,#F7EFE0,#FBF6EC);border:1px solid #EADBB8}
.clue .n{width:32px;height:32px;border-radius:50%;background:var(--pine);color:var(--gold-soft);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:18px}
.clue p{margin:0;font-size:15.5px;line-height:1.45}
.clue p em{display:block;font-style:normal;color:var(--ink-3);font-size:13px;margin-top:4px}
.d-foot{padding:14px 20px 20px;display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:12.5px;border-top:1px dashed #E3D6BE;margin-top:10px}
.actions{display:grid;gap:12px;margin-top:18px}
.actions .row{display:flex;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:99px;font-size:15px;opacity:0;transition:all .3s var(--ease);z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* organizer */
.panel{margin-top:18px;background:var(--paper);border-radius:26px;padding:22px 18px;box-shadow:var(--shadow);border:1px solid rgba(201,164,92,.35)}
.panel h2{font-size:30px;line-height:1.1}
.panel p{color:var(--ink-2);font-size:15.5px;line-height:1.5}
.form{display:grid;gap:14px;margin-top:16px}
.form label{display:grid;gap:6px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.form input,.form select{font:inherit;font-size:18px;padding:14px 16px;border-radius:16px;border:1.5px solid #E2D7C4;background:#fff;color:var(--ink);width:100%;letter-spacing:normal;text-transform:none;font-weight:400}
.form .two{display:grid;grid-template-columns:1fr 112px;gap:10px}
.linkbox{margin-top:16px;padding:14px;border-radius:16px;background:var(--cream);border:1px dashed #D8C7A5;word-break:break-all;font-size:13.5px;color:var(--ink-2)}
.note{margin-top:16px;padding:14px;border-radius:16px;background:#F2F5F1;border:1px solid #D5E0D4;font-size:14.5px;color:#2F4A3C;line-height:1.5}
.resume{margin-top:16px;padding:14px 16px;border-radius:16px;background:rgba(251,246,236,.1);border:1px solid rgba(251,246,236,.25);color:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.resume .btn{min-height:44px;font-size:15px;padding:0 16px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,25,20,.78);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);animation:enter .3s var(--ease) both}
.modal .box{background:var(--paper);border-radius:24px;max-width:460px;width:100%;max-height:100%;overflow:auto;padding:16px;box-shadow:var(--shadow)}
.modal img{width:100%;height:auto;border-radius:14px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.18);-webkit-touch-callout:default;user-select:auto}
.modal p{margin:12px 4px 4px;font-size:15px;color:var(--ink-2);text-align:center;line-height:1.45}
.modal .actions{margin-top:12px}
.foot .legal{display:block;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:420px){ .hero h1{font-size:50px} .q-title{font-size:34px} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  #snow{display:none}
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="app">
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Secret Santa Detective, go to start">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="8.5" fill="none" stroke="#C9A45C" stroke-width="2.4"/><path d="M19.5 19.5l7 7" stroke="#C9A45C" stroke-width="3" stroke-linecap="round"/><path d="M13 8.5v9M8.5 13h9" stroke="#F4DDDD" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Secret Santa Detective</span>
    </button>
    <button class="iconbtn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="announce" aria-live="polite"></div>

<script>
"use strict";
/* ================================================================ data */
const QUESTIONS = [
  {id:"nm", type:"text", eyebrow:"The case begins", title:"What should we call you?",
   hint:"Your first name or nickname, so your Secret Santa knows it's you.", placeholder:"e.g. Mia"},
  {id:"vibe", type:"cards", eyebrow:"Clue 2 · Your vibe", title:"Which one sounds most like you?",
   hint:"Go with your first instinct.", options:[
    {v:"cozy", e:"🛋️", t:"Cozy homebody", s:"Blankets, slippers, a good film"},
    {v:"adventure", e:"🏔️", t:"Adventurer", s:"Always planning the next trip"},
    {v:"creative", e:"🎨", t:"Creative soul", s:"Making, drawing, crafting"},
    {v:"foodie", e:"🍜", t:"Foodie", s:"Every plan involves snacks"},
    {v:"bookworm", e:"📚", t:"Bookworm", s:"One more chapter, always"},
    {v:"techie", e:"💻", t:"Gadget fan", s:"Loves clever little tools"}]},
  {id:"drink", type:"duo", eyebrow:"Clue 3 · This or that", title:"Coffee or tea?",
   options:[{v:"coffee", e:"☕", t:"Coffee"},{v:"tea", e:"🍵", t:"Tea"}], neither:{v:"neither", t:"Neither, thanks"}},
  {id:"snack", type:"duo", eyebrow:"Clue 4 · This or that", title:"Sweet or salty?",
   options:[{v:"sweet", e:"🍫", t:"Sweet"},{v:"salty", e:"🥨", t:"Salty"}], neither:{v:"neither", t:"I like both"}},
  {id:"ints", type:"multi", max:3, eyebrow:"Clue 5 · Interests", title:"Pick up to three things you love.",
   hint:"These shape your gift clues the most.", options:[
    {v:"cooking", e:"🍳", t:"Cooking"},{v:"fitness", e:"🏋️", t:"Fitness"},{v:"gaming", e:"🎮", t:"Gaming"},
    {v:"music", e:"🎧", t:"Music"},{v:"plants", e:"🪴", t:"Plants"},{v:"travel", e:"✈️", t:"Travel"},
    {v:"fashion", e:"🧣", t:"Fashion"},{v:"decor", e:"🖼️", t:"Home decor"},{v:"reading", e:"📖", t:"Reading"},
    {v:"outdoors", e:"🌲", t:"Outdoors"},{v:"movies", e:"🎬", t:"Movies"},{v:"pets", e:"🐾", t:"Pets"}]},
  {id:"col", type:"swatch", eyebrow:"Clue 6 · Colours", title:"Which colour makes you happy?",
   options:[
    {v:"forest", t:"Forest", c:"#2F5A45"},{v:"berry", t:"Berry", c:"#9E2A3A"},{v:"gold", t:"Gold", c:"#C9A45C"},
    {v:"navy", t:"Navy", c:"#24375A"},{v:"blush", t:"Blush", c:"#E9B8B2"},{v:"charcoal", t:"Charcoal", c:"#3B3A37"},
    {v:"cream", t:"Cream", c:"#F1E6D2"},{v:"rainbow", t:"All of them", c:"conic-gradient(#E76F51,#F4A261,#E9C46A,#2A9D8F,#4D7CC9,#9B5DE5,#E76F51)"}]},
  {id:"mood", type:"scale", eyebrow:"Clue 7 · Gift style", title:"Practical or just for fun?",
   left:{e:"🧰", t:"Practical"}, right:{e:"🎉", t:"Just for fun"},
   captions:["Useful every single day","Mostly useful","A bit of both","Mostly fun","Pure joy, zero purpose"]},
  {id:"exp", type:"duo", eyebrow:"Clue 8 · This or that", title:"A thing to keep or an experience?",
   options:[{v:"thing", e:"🎁", t:"A thing"},{v:"experience", e:"🎟️", t:"An experience"}], neither:{v:"either", t:"Either is lovely"}},
  {id:"scent", type:"cards", eyebrow:"Clue 9 · Scents", title:"Which scent feels like you?",
   options:[
    {v:"woody", e:"🌲", t:"Woody", s:"Cedar, pine, campfire"},
    {v:"fresh", e:"🍋", t:"Fresh", s:"Citrus, linen, sea breeze"},
    {v:"sweet", e:"🍦", t:"Sweet", s:"Vanilla, caramel"},
    {v:"spicy", e:"🫚", t:"Warm & spicy", s:"Cinnamon, ginger"},
    {v:"none", e:"🚫", t:"No scents, please", s:"Unscented is best"}]},
  {id:"no", type:"multi", max:8, exclusive:"easy", eyebrow:"Clue 10 · Plot twists", title:"Please don't gift me…",
   hint:"Tap anything you'd rather not receive.", options:[
    {v:"candles", e:"🕯️", t:"Candles"},{v:"mugs", e:"☕", t:"Mugs"},{v:"socks", e:"🧦", t:"Socks"},
    {v:"alcohol", e:"🍷", t:"Alcohol"},{v:"sweets", e:"🍬", t:"Sweets"},{v:"clutter", e:"🧸", t:"Decor & clutter"},
    {v:"giftcards", e:"💳", t:"Gift cards"},{v:"easy", e:"😊", t:"Nothing, I'm easy"}]},
  {id:"wish", type:"cards", eyebrow:"Clue 11 · Secret wish", title:"What would make you smile most?",
   options:[
    {v:"handmade", e:"🧶", t:"Something handmade", s:"Made with care, by hand"},
    {v:"useful", e:"✨", t:"Something useful", s:"I'll use it every day"},
    {v:"edible", e:"🍪", t:"Something to eat", s:"Treats are always welcome"},
    {v:"surprise", e:"🎲", t:"Total surprise", s:"Amaze me"}]},
  {id:"size", type:"chips1", eyebrow:"Clue 12 · Last detail", title:"If someone gifts clothes, I'm a…",
   hint:"Optional, but handy for scarves, hats or cozy tops.", options:[
    {v:"XS", t:"XS"},{v:"S", t:"S"},{v:"M", t:"M"},{v:"L", t:"L"},{v:"XL", t:"XL"},{v:"XXL", t:"XXL"},{v:"skip", t:"Skip"}]},
];
const BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const label = (qid, v) => { const o = (BY_ID[qid].options || []).find(x => x.v === v) || (BY_ID[qid].neither && BY_ID[qid].neither.v === v ? BY_ID[qid].neither : null); return o ? o.t : ""; };
const emoji = (qid, v) => { const o = (BY_ID[qid].options || []).find(x => x.v === v); return o && o.e ? o.e : ""; };

/* Gift clues: each rule scores against the answers; 'avoid' removes it when the person said no. */
const CLUES = [
  {need:a=>a.drink==="coffee", w:2.5, t:"A coffee tasting trio: three small bags of beans from different origins, with a handwritten tasting card.", why:"Coffee over tea"},
  {need:a=>a.drink==="tea", w:2.5, t:"A loose-leaf tea sampler with a pretty infuser and a note: “for your coziest evenings”.", why:"Tea over coffee"},
  {need:a=>has(a,"cooking"), w:3, t:"A spice blend set for a cuisine they love, plus one recipe you copied out by hand.", why:"Loves cooking"},
  {need:a=>has(a,"fitness"), w:3, t:"A quality skipping rope or resistance-band set, with a card that says “first workout's on me”.", why:"Into fitness"},
  {need:a=>has(a,"gaming"), w:3, t:"A game-night box: their favourite snacks, a small controller stand or a cozy gaming headset cushion.", why:"Gamer at heart"},

function has(a, v){ return Array.isArray(a.ints) && a.ints.includes(v); }

function giftClues(a){
  const no = new Set((a.no || []).filter(x => x !== "easy"));
  const scored = [];
  CLUES.forEach((c, i) => {
    let ok = false;
    try { ok = !!c.need(a); } catch(e){ ok = false; }
    if(!ok) return;
    if(c.avoid && c.avoid.some(x => no.has(x))) return;
    let text = c.t.replace("{size}", a.size || "");
    const low = text.toLowerCase();
    for(const k of no){ if((AVOID_TEXT[k] || []).some(w => low.includes(w))) return; }
    if(c.colour && a.col && COLOUR_NAMES[a.col]) text += ` Think ${COLOUR_NAMES[a.col]}.`;
    scored.push({score: c.w + (i * 0.001), text, why: c.why});

  scored.sort((x, y) => y.score - x.score);

  for(const s of scored){ if(seen.has(s.why)) continue; seen.add(s.why); out.push(s); if(out.length === 3) break; }
  const fallback = [
    {text:"A handwritten card listing three things you appreciate about them, tucked into any small gift.", why:"Always a winner"},
    {text:"A beautifully wrapped treat from a local shop they've never tried.", why:"A safe, thoughtful choice"},
    {text:"A simple desk upgrade: a good pen and a notebook in their favourite colour.", why:"Simple and useful"}];
  for(const f of fallback){ if(out.length >= 3) break; out.push(f); }
  return out;
}

}

}
function unpackProfile(s){

}
function packEvent(ev){ return b64urlEncode(JSON.stringify({v:1, n:ev.n||"", d:ev.d||"", b:ev.b||"", c:ev.c||"€"})); }

function sanitize(a){

  out.nm = String(a.nm || "").replace(/[<>]/g, "").trim().slice(0, 30);
  for(const id of ["vibe","drink","snack","col","exp","scent","wish","size"]){
    const q = BY_ID[id]; const ok = (q.options || []).some(o => o.v === a[id]) || (q.neither && q.neither.v === a[id]);
    if(ok) out[id] = a[id];

function wrapLines(ctx, text, maxW){

function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  const W = 1080;

  x.fillStyle = "#FBF6EC"; x.font = `italic 44px ${SERIF}`; x.fillText(ev && ev.n ? ev.n : "Gift Profile", W / 2, 150);

  y += 56; x.fillStyle = "#9E2A3A"; x.font = `italic 40px ${SERIF}`; x.fillText(`${emoji("vibe", a.vibe)} ${label("vibe", a.vibe)}`, px + 50, y);

  const no = (a.no || []).filter(v => v !== "easy").map(v => label("no", v));

  wrapLines(x, no.length ? no.join(" · ") : "😊 Anything goes", pw - 100).slice(0, 2).forEach((ln, i) => x.fillText(ln, px + 50, y + i * 38));

    x.fillStyle = "#EADBB8"; x.font = `600 28px ${SERIF}`; x.textAlign = "center"; x.fillText(String(i + 1), px + 86, y + 52); x.textAlign = "left";

  return y;
}

/* ================================================================ motion */

    for(const f of flakes){ f.y += f.s; f.d += 0.01; f.x += Math.sin(f.d) * 0.3; if(f.y > h + 5){ f.y = -5; f.x = Math.random() * w; } ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
